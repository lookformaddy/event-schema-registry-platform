# CI definition — SHIP NOTE: this file lives in docs/ because the
# push integration used for this repo lacks the Workflows permission
# and rejects files under .github/workflows/. To activate, move this
# file to .github/workflows/ci.yml (no content change needed).
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: make test
